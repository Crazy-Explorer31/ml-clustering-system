openapi: 3.0.3
info:
  title: ML Clustering System
  description: |
    Two‑server architecture:
    - **Main Server** – user‑facing API for registration, authentication, dataset upload, job submission, status polling, and result retrieval.
    - **Jobs Production Server** – internal API used to manage job lifecycle (commit, info, delete, status update).
  version: 2.0.0

servers:
  - url: http://localhost:8000
    description: Main server (user‑facing, local)
  - url: http://localhost:8001
    description: Jobs production server (internal)

tags:
  - name: Authentication
    description: User registration and login
  - name: Main
    description: Endpoints exposed to end users
  - name: Admin
    description: Admin‑only endpoints
  - name: JobsProduction
    description: Internal endpoints for job orchestration

paths:
  # ==================== Auth ====================
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Пользователь создан
        '400':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /token:
    post:
      tags:
        - Authentication
      summary: Login with credentials (sets httpOnly cookie + returns JSON)
      operationId: loginForAccessToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Successful login, access_token set in cookie and body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=eyJ...; HttpOnly; Path=/
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== Main server ====================
  /:
    get:
      tags:
        - Main
      summary: Root redirect to /ui
      operationId: rootRedirect
      responses:
        '303':
          description: Redirect to /ui

  /upload_dataset:
    post:
      tags:
        - Main
      summary: Upload a CSV dataset
      description: Uploads a CSV file, preprocesses it, and stores in S3. Requires authentication.
      operationId: uploadDataset
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file with a "text" column
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  bucket:
                    type: string
                  key:
                    type: string
        '400':
          description: File must be CSV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: S3 upload error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /perform_clustering:
    post:
      tags:
        - Main
      summary: Submit a new clustering job
      description: |
        Accepts clustering parameters (dataset, algorithm, embeddings method, hyperparameters).
        Returns a job ID that can be used to track progress. Requires authentication.
      operationId: performClustering
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusteringRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '404':
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /job_info/{job_id}:
    get:
      servers:
        - url: http://localhost:8000
          description: Main server (user‑facing)
        - url: http://localhost:8001
          description: Jobs production server (internal)
      tags:
        - Main
        - JobsProduction
      summary: Get job status and parameters
      description: |
        Exists on both servers.
        **Main server** — returns status for authenticated users.
        **Jobs server** — returns raw job state from Redis (internal).
      operationId: getJobInfo
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: Job identifier
      responses:
        '200':
          description: Job info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInfoResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /job_result/{job_id}:
    get:
      tags:
        - Main
      summary: Get pre‑signed download URL for clustering result
      description: |
        Returns a pre‑signed S3 URL (10 min expiry) to download the clustering result CSV.
        Requires the job to be in "done" status. Requires authentication.
      operationId: getJobResult
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: Job identifier
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusteringResultResponse'
        '403':
          description: Result not ready yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /job_plot/{job_id}:
    get:
      tags:
        - Main
      summary: Get clustering visualization PNG
      description: |
        Returns a PNG image showing cluster size histogram with LDA‑generated theme labels
        and quality metrics (Davies‑Bouldin, Calinski‑Harabasz, Dunn). Requires authentication.
      operationId: getJobPlot
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: Job identifier
      responses:
        '200':
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '403':
          description: Result not ready yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ui:
    get:
      tags:
        - Main
      summary: Serve main web UI
      operationId: serveMainUi
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
  /ui/:
    get:
      tags:
        - Main
      summary: Serve main web UI (trailing slash)
      operationId: serveMainUiSlash
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  # ==================== Admin ====================
  /authorised_users_ui:
    get:
      tags:
        - Admin
      summary: Admin panel — authorised users
      operationId: serveAuthorisedUsersUi
      security:
        - bearerAuth: []
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /queries_history_ui:
    get:
      tags:
        - Admin
      summary: Admin panel — query history
      operationId: serveQueriesHistoryUi
      security:
        - bearerAuth: []
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /get_queries_history:
    get:
      tags:
        - Admin
      summary: Get full query history JSON
      operationId: getQueriesHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Query history data
          content:
            application/json:
              schema:
                type: object

  /get_authorised_users:
    get:
      tags:
        - Admin
      summary: Get all authorised users JSON
      operationId: getAuthorisedUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authorised users data
          content:
            application/json:
              schema:
                type: object

  # ==================== Jobs production server ====================
  /job_commit:
    post:
      tags:
        - JobsProduction
      summary: Enqueue a new clustering job
      description: |
        Validates the request, persists job state as "waiting", and enqueues the job
        in Redis Queue for the rq‑worker to pick up.
      operationId: commitJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusteringRequest'
      responses:
        '202':
          description: Job committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /job_delete/{job_id}:
    delete:
      tags:
        - JobsProduction
      summary: Delete a job
      description: Removes the job state from Redis.
      operationId: deleteJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: Job identifier
      responses:
        '201':
          description: Job deleted
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /job_update/{job_id}:
    put:
      tags:
        - JobsProduction
      summary: Update job status
      description: Called by workers to update job status (running, done, failed).
      operationId: updateJobStatus
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: Job identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdateRequest'
      responses:
        '201':
          description: Status updated
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT stored in an httpOnly cookie set by /token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the access_token field in /token response

  schemas:
    # ---------- Auth ----------
    Token:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer

    User:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        full_name:
          type: string
        disabled:
          type: boolean
          default: false

    UserCreate:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - password
          properties:
            password:
              type: string

    # ---------- Query schemas ----------
    ClusteringRequest:
      type: object
      required:
        - dataset_id
        - clustering_algo
        - embeddings_method
        - clustering_hyperparams
        - embeddings_hyperparams
        - theme_length
      properties:
        dataset_id:
          type: string
          description: ID (key) of the dataset in S3
        clustering_algo:
          type: string
          enum: [kmeans, spectral]
          description: Clustering algorithm to use
        embeddings_method:
          type: string
          enum: [tfidf, word2vec, doc2vec]
          description: Embedding method
        clustering_hyperparams:
          type: object
          description: Hyperparameters for the clustering algorithm
          example:
            n_clusters: 5
            random_state: 42
        embeddings_hyperparams:
          type: object
          description: Hyperparameters for the embedding method
          example:
            max_features: 1000
        theme_length:
          type: integer
          description: Number of words for LDA cluster theme labels
          example: 3
      example:
        dataset_id: "user/dataset.csv"
        clustering_algo: "kmeans"
        embeddings_method: "tfidf"
        clustering_hyperparams:
          n_clusters: 5
        embeddings_hyperparams:
          max_features: 1000
        theme_length: 3

    JobUpdateRequest:
      type: object
      required:
        - new_status
      properties:
        new_status:
          type: string
          enum: [waiting, running, done, failed]
          description: New status for the job

    JobAcceptedResponse:
      type: object
      required:
        - job_id
      properties:
        job_id:
          type: string
          description: Unique identifier for the queued job
      example:
        job_id: "abc123"

    JobInfoResponse:
      type: object
      required:
        - status
        - dataset_id
        - clustering_algo
        - embeddings_method
        - clustering_hyperparams
        - embeddings_hyperparams
        - theme_length
      properties:
        status:
          type: string
          enum: [waiting, running, done, failed]
          description: Current status of the job
        dataset_id:
          type: string
        clustering_algo:
          type: string
        embeddings_method:
          type: string
        clustering_hyperparams:
          type: object
        embeddings_hyperparams:
          type: object
        theme_length:
          type: integer
      example:
        status: "running"
        dataset_id: "user/dataset.csv"
        clustering_algo: "kmeans"
        embeddings_method: "tfidf"
        clustering_hyperparams:
          n_clusters: 5
        embeddings_hyperparams:
          max_features: 1000
        theme_length: 3

    ClusteringResultResponse:
      type: object
      required:
        - download_url
      properties:
        download_url:
          type: string
          format: uri
          description: Pre‑signed S3 URL (valid for 10 minutes)
      example:
        download_url: "https://minio.example.com/results/job-abc.csv?X-Amz-Algorithm=..."

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Human‑readable error description
      example:
        detail: "Job not found"
